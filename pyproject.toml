[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-noise-separation"
version = "0.2.0"
description = "RecurGraph mining and Transfer-DiT separation for legged robot audition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
dependencies = [
  "einops",
  "huggingface_hub",
  "numpy",
  "scikit-learn",
  "soundfile",
  "torch",
]

[tool.setuptools.packages.find]
include = ["learning2hear*"]
